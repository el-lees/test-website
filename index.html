<!DOCTYPE html>
<html>
  <title>My First Website</title>
  </head>
  <body>
<h1>Hello world!</h1>
<details>
<summary style="color: #9333ea; ">click here</summary>
<p> <strong>Close</strong> me!<p>
</details>

<h2>Bar chart</h2>
    <div id="chart"></div>
    <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
    <script>
      const data = [
        { name: "A", value: 1 },
        { name: "B", value: 5 },
        { name: "C", value: 8 },
        { name: "D", value: 10 }
      ];

      // Chart dimensions
      const margin = { top: 20, right: 40, bottom: 30, left: 10 };
      const width  = 300 - margin.left - margin.right;
      const height = 300 - margin.top  - margin.bottom;

      // SVG container
      const svg = d3.select("#chart")
        .append("svg")
          .attr("width",  width  + margin.left + margin.right)
          .attr("height", height + margin.top  + margin.bottom)
        .append("g")
          .attr("transform", `translate(${margin.left},${margin.top})`);

      // Scales
      const x = d3.scaleBand()
        .domain(data.map(d => d.name))
        .range([0, width])
        .padding(0.3);

      const y = d3.scaleLinear()
        .domain([0, d3.max(data, d => d.value)])
        .nice()
        .range([height, 0]);

      // X axis (no tick marks)
      svg.append("g")
        .attr("transform", `translate(0,${height})`)
        .call(d3.axisBottom(x).tickSize(0))
          .call(g => g.selectAll(".tick text").attr("dy", "1.2em"));

      // Grid lines (every 2 units, no domain line)
      const gridTicks = d3.range(0, d3.max(data, d => d.value) + 1, 2);

      svg.append("g")
        .call(
          d3.axisLeft(y)
            .tickValues(gridTicks)
            .tickSize(-width)
            .tickFormat("")
        )
        .call(g => g.select(".domain").remove())
        .call(g => g.selectAll(".tick line")
          .attr("stroke", "#e5e7eb")
        );

      // Grid labels (above each line, right-aligned)
      gridTicks.forEach(val => {
        svg.append("text")
          .attr("x", width - 4)
          .attr("y", y(val) - 3)
          .attr("text-anchor", "end")
          .attr("font-size", "11px")
          .attr("fill", "#6b7280")
          .text(val);
      });

      // Bars
      const barWidth = x.bandwidth() * 0.8;

      svg.selectAll(".bar")
        .data(data)
        .enter()
        .append("rect")
          .attr("class", "bar")
          .attr("x",      d => x(d.name) + (x.bandwidth() - barWidth) / 2)
          .attr("y",      d => y(d.value))
          .attr("width",  barWidth)
          .attr("height", d => height - y(d.value))
          .attr("fill",   "#9333ea");
    </script>
  </body>
</html>
